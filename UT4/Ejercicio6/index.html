<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 5</title>
    <script src="./Ejercicio6/scripts/ejercicio6.js" defer></script>
    <link rel="stylesheet" href="./css/principal.css">
</head>
<body>
    <div class="container">
        <h1>Gestión de Clientes</h1>

        <!-- Formulario de Clientes -->
        <form class="form-cliente">
            <h2>Datos del Cliente</h2>

            <div class="form-group">
                <label for="nombre">Nombre de cliente:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="apellidos">Apellidos:</label>
                <input type="text" id="apellidos" name="apellidos" required>
            </div>

            <div class="form-group">
                <label for="dni">DNI:</label>
                <input type="text" id="dni" name="dni" required>
            </div>

            <div class="form-group">
                <label for="fechaNacimiento">Fecha de nacimiento (dd/mm/aaaa):</label>
                <input type="text" id="fechaNacimiento" name="fechaNacimiento" placeholder="dd/mm/aaaa" required>
            </div>

            <div class="form-group">
                <label>Sexo:</label>
                <div class="radio-group">
                    <label><input type="radio" name="sexo" value="M"> Mujer (M)</label>
                    <label><input type="radio" name="sexo" value="H"> Hombre (H)</label>
                </div>
            </div>

            <div class="form-group">
                <label>Preferencias:</label>
                <div class="checkbox-group">
                    <label><input type="checkbox" name="preferencias" value="ext"> Deportes de exterior (ext)</label>
                    <label><input type="checkbox" name="preferencias" value="equi"> Deportes de equipo (equi)</label>
                    <label><input type="checkbox" name="preferencias" value="indv"> Deportes individuales (indv)</label>
                    <label><input type="checkbox" name="preferencias" value="int"> Deportes de interior (int)</label>
                </div>
            </div>

            <!-- Botones requeridos -->
            <div class="button-group">
                <button type="button" class="btn-guardar">Guardar Cliente</button>
                <button type="button" class="btn-borrar">Borrar por DNI</button>
                <button type="button" class="btn-actualizar">Actualizar por DNI</button>
            </div>
        </form>

        <!-- Tabla de Clientes -->
        <div class="table-container">
            <h2>Lista de Clientes</h2>
            <table>
                <thead>
                    <tr>
                        <th>Id</th>
                        <th>Nombre y apellidos</th>
                        <th>Fecha nacimiento</th>
                        <th>Sexo</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>1</td>
                        <td>Sonia Gutiérrez García</td>
                        <td>10/10/1010</td>
                        <td>M</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
