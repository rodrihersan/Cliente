<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de facturas</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../javascript/ejercicio1.js" defer></script>
</head>

<body>

    <h1>Gestión de facturas</h1>

    <!-- Formulario para introducir facturas -->
    <form class="formulario">

        <h2>Nueva factura</h2>

        <label for="descripcion">Descripción de la compra:</label>
        <input type="text" id="descripcion" required>

        <label for="precio">Precio total:</label>
        <input type="number" id="precio" step="0.01" required>

        <label for="fecha">Fecha de compra:</label>
        <input type="date" id="fecha" required>

        <button type="button" onclick="guardarFactura()">
            Guardar factura
        </button>

    </form>


    <!-- Selector de fecha fuera del formulario -->
    <div class="consulta">

        <label for="fechaConsulta">Selecciona una fecha:</label>
        <input type="date" id="fechaConsulta" onchange="mostrarFacturas()">

    </div>


    <!-- Tabla de facturas -->
    <table>

        <thead>
            <tr>
                <th>ID</th>
                <th>Descripción</th>
                <th>Precio</th>
                <th>Fecha</th>
            </tr>
        </thead>

        <tbody id="tablaFacturas">

        </tbody>

    </table>

</body>

</html>
